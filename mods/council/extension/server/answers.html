<!doctype html>
<!-- ABOUTME: The council answers panel Claude Desktop draws under a council_ask call (an MCP App page) -->
<!-- ABOUTME: One card per seat with its answer or its error; the data arrives as the tool's result -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Respuestas del consejo</title>
<style>
  /* @include panel-style.css */
  /* @include seat-cards.css */
</style>
</head>
<body>
<main>
  <header><h1>Respuestas del consejo</h1><span id="status" role="status"></span></header>
  <p class="lead" id="question">Esperando la pregunta.</p>
  <div id="seats" class="seat-list" aria-live="polite"></div>
</main>
<script>
'use strict'
// @include panel-host.js
// @include panel-page.js
// @include marks.js
// @include markdown.js
// @include seat-cards.js
const question = document.getElementById('question')
const seats = document.getElementById('seats')

function showResult(result) {
  if (!result?.isError && Array.isArray(result?.structuredContent?.seats) && result.structuredContent.question) question.textContent = result.structuredContent.question
  showAnswers(result, seats, 'Claude recibió todo el contenido.')
}

host.connect('council-answers', {
  'ui/notifications/tool-input': params => {
    if (typeof params?.arguments?.question === 'string') question.textContent = params.arguments.question
    report('consultando al consejo')
    host.reportSize()
  },
  'ui/notifications/tool-result': showResult,
  'ui/notifications/tool-cancelled': () => {
    report('cancelado', true)
    seats.replaceChildren(element('p', { className: 'lead', textContent: 'La pregunta al consejo se canceló antes de que llegaran las respuestas.' }))
    host.reportSize()
  },
}).catch(err => { seats.replaceChildren(element('p', { className: 'lead bad', textContent: `No se pudo conectar con Claude Desktop (${err.message}).` })) })
</script>
</body>
</html>
